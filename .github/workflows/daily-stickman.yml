name: Daily Stickman

on:
  schedule:
    # GitHub's scheduler is unreliable on new repos; run manually or trigger externally if these don't fire.
    - cron: "37 0 * * *"      # 06:07 IST
    - cron: "57 2 * * *"      # 08:27 IST (backup)
  workflow_dispatch:
    inputs:
      count:
        description: "How many videos"
        default: "4"
      force:
        description: "Run even if today's batch already exists"
        default: "false"

permissions:
  contents: write

concurrency: daily-stickman

jobs:
  make:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Already done today?
        id: check
        run: |
          TODAY=$(TZ=Asia/Kolkata date +%F)
          if [ "${{ github.event.inputs.force }}" != "true" ] && [ -f state/history.json ] && grep -q "\"date\": \"$TODAY\"" state/history.json; then
            echo "Batch for $TODAY already exists, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache voice model
        if: steps.check.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-hf-v1

      - name: System packages
        if: steps.check.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libcairo2-dev pkg-config espeak-ng
          mkdir -p ~/.local/share/fonts && cp fonts/*.otf ~/.local/share/fonts/ && fc-cache -f

      - name: Python packages
        if: steps.check.outputs.skip != 'true'
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Make today's stickman Shorts
        if: steps.check.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m stick.batch --count "${{ github.event.inputs.count || '4' }}"

      - name: Upload to YouTube (only when AUTO_UPLOAD = true)
        if: steps.check.outputs.skip != 'true' && vars.AUTO_UPLOAD == 'true'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PUBLISH_SLOTS: ${{ vars.PUBLISH_SLOTS || '09:00,13:00,19:00,22:30' }}
        run: python -m stick.upload --out out

      - name: Keep videos as a downloadable artifact (7 days)
        if: always() && steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stickman-${{ github.run_number }}
          path: out/
          retention-days: 7

      - name: Save topic history
        if: success() && steps.check.outputs.skip != 'true'
        run: |
          git config user.name  "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add state/history.json
          git commit -m "Stickman batch $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase && git push
